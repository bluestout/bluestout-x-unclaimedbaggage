query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            inClearanceBundle: inAnyCollection(ids: ["gid://shopify/Collection/304783392853"])
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
